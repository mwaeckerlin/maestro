services:
  maestro:
    image: mwaeckerlin/maestro
    build: .
    ports:
      - 42003:42003
    volumes:
      - models:/models
      - output:/output
    # a tmpfs belongs to root; the service runs as somebody (uid 100, gid 1000)
    tmpfs:
      - /state:uid=100,gid=1000,mode=0700
      - /tmp:mode=1777
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
  output:
