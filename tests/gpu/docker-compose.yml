# GPU suite: the real Maestro server of the image on an NVIDIA GPU, behind
# Traefik with the prefix route of the Swarm deployment. Runs only on a host
# with an NVIDIA GPU and the NVIDIA container toolkit.
name: maestro-gpu

services:

  maestro:
    image: mwaeckerlin/maestro
    pull_policy: never
    environment:
      MAESTRO_CONFIG: '{"profile":4,"video_profile":4,"image_profile":4,"vae_config":3,"services":{"auto_performance":false}}'
    # a tmpfs belongs to root; the service runs as somebody (uid 100, gid 1000)
    tmpfs:
      - /state:uid=100,gid=1000,mode=0700
      - /tmp:mode=1777
    volumes:
      - models:/models
      - output:/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  proxy:
    image: maestro-gpu-proxy
    build:
      context: proxy
    pull_policy: build
    depends_on:
      - maestro

  test-runner:
    image: maestro-gpu-runner
    build:
      context: .
    pull_policy: build
    depends_on:
      - proxy
    environment:
      PROXY_URL: http://proxy
      PREFIX: /spark-test/maestro
    command: ["pytest", "-v", "--tb=short", "-W", "error", "-p", "no:cacheprovider"]

volumes:
  models:
  output:
